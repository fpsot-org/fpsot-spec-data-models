# SPDX-License-Identifier: Apache-2.0
name: ci
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
env:
  # Requirement ID prefix of this specification.
  SPEC_PREFIX: DMO
jobs:
  prefix:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.p.outputs.value }}
    steps:
      - id: p
        run: echo "value=$SPEC_PREFIX" >> "$GITHUB_OUTPUT"
  spec-check:
    if: github.ref_type != 'tag'
    needs: prefix
    uses: fpsot-org/GitHub-Actions/.github/workflows/spec-check.yml@v0
    with:
      prefix: ${{ needs.prefix.outputs.value }}
      doc-rules: true
  model:
    # Fails when a generated file drifts from model/party.yaml, or when an example
    # gives the wrong result (DMO-015, DMO-017). A required check of the main branch.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install --quiet -r model/requirements.txt
      - run: bash model/test-model.sh
  diagrams:
    if: github.ref_type != 'tag'
    uses: fpsot-org/GitHub-Actions/.github/workflows/diagrams.yml@v0
  pr-title:
    if: github.event_name == 'pull_request'
    uses: fpsot-org/GitHub-Actions/.github/workflows/pr-title.yml@v0
    permissions:
      pull-requests: read
  signed-commits:
    if: github.event_name == 'pull_request'
    uses: fpsot-org/GitHub-Actions/.github/workflows/signed-commits.yml@v0
    permissions:
      contents: read
      pull-requests: read
  release:
    if: github.ref_type == 'tag'
    needs: prefix
    uses: fpsot-org/GitHub-Actions/.github/workflows/spec-release.yml@v0
    permissions:
      contents: write
    secrets: inherit
    with:
      prefix: ${{ needs.prefix.outputs.value }}
      doc-rules: true
