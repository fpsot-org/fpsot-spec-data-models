code: CA
name: {en: Canada, fr: Canada}
rows:
  - id: DMO-030
    text: {en: "Departments must store and share gender with the codes of the standard's table, 1, 2 and 3, and publish its terms. FPSOT binds such a field to a vocabulary and keeps those codes as strings in their issuer form.", fr: "Les ministères doivent conserver et échanger le genre avec les codes du tableau de la norme, 1, 2 et 3, et en publier les termes. FPSOT rattache un tel champ à un vocabulaire et garde ces codes sous forme de chaînes, dans la forme de l’émetteur."}
    status: stricter
    source: {title: "Treasury Board of Canada Secretariat, Data Reference Standard on Person(s): Gender", version: "Effective 2024-09-27", date: "2026-03-13", url: "https://www.canada.ca/en/government/system/digital-government/digital-government-innovations/enabling-interoperability/gc-enterprise-data-reference-standards/data-reference-standard-person-gender.html", archive: "https://web.archive.org/web/20260513074733/https://www.canada.ca/en/government/system/digital-government/digital-government-innovations/enabling-interoperability/gc-enterprise-data-reference-standards/data-reference-standard-person-gender.html"}
    last_checked: "2026-11-07"
  - id: DMO-032
    text: {en: "Departments record a primary name and secondary names, with the name type, the source, the source date, the collection date and the last modified date. The full name is the primary name followed by the secondary names, and a name that cannot be split goes whole in the primary name. Name fields can repeat, and an alternate name must be offered when a legal name is collected. FPSOT requires only the full name, and keeps the name type in its core nameType slot. A federal deployment can add the source and the dates in the ca member of extensions.", fr: "Les ministères consignent un nom principal et des noms secondaires, avec le type de nom, la source, la date de la source, la date de collecte et la date de dernière modification. Le nom complet est le nom principal suivi des noms secondaires, et un nom qui ne peut pas être divisé va en entier dans le nom principal. Les champs de nom peuvent se répéter, et un autre nom doit être offert quand un nom légal est recueilli. FPSOT exige seulement le nom complet, et garde le type de nom dans son attribut de base nameType. Un déploiement fédéral peut ajouter la source et les dates dans le membre ca d’extensions."}
    status: stricter
    source: {title: "Treasury Board of Canada Secretariat, Data Reference Standard on Person(s): Name architecture", version: "Effective 2024-09-27", date: "2026-03-13", url: "https://www.canada.ca/en/government/system/digital-government/digital-government-innovations/enabling-interoperability/gc-enterprise-data-reference-standards/data-reference-standard-person-name-architecture.html", archive: "https://web.archive.org/web/20260614110830/https://www.canada.ca/en/government/system/digital-government/digital-government-innovations/enabling-interoperability/gc-enterprise-data-reference-standards/data-reference-standard-person-name-architecture.html"}
    last_checked: "2026-11-07"
  - id: DMO-046
    text: {en: "The nine-digit business number is the standard identifier of sole proprietorships, partnerships and corporations in all their dealings with the Government of Canada. Departments must validate it. The standard gives its data type as numeric, while FPSOT keeps it as a string of nine digits, under DAT-066.", fr: "Le numéro d’entreprise de neuf chiffres est l’identifiant normalisé des entreprises individuelles, des sociétés de personnes et des sociétés par actions dans tous leurs rapports avec le gouvernement du Canada. Les ministères doivent le valider. La norme lui donne un type numérique, alors que FPSOT le garde sous forme de chaîne de neuf chiffres, selon DAT-066."}
    status: stricter
    source: {title: "Treasury Board of Canada Secretariat, Data Reference Standard on Business Number", version: "Effective 2024-05-07", date: "2026-03-13", url: "https://www.canada.ca/en/government/system/digital-government/digital-government-innovations/enabling-interoperability/gc-enterprise-data-reference-standards/data-reference-standard-business-number.html", archive: "https://web.archive.org/web/20261024211521/https://www.canada.ca/en/government/system/digital-government/digital-government-innovations/enabling-interoperability/gc-enterprise-data-reference-standards/data-reference-standard-business-number.html"}
    last_checked: "2026-11-07"
